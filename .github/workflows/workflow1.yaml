      ######################################
      # IOT: C Code Build + (Basic Test)
      ######################################
      - name: Install tools for C build
        run: sudo apt-get update && sudo apt-get install -y gcc libmosquitto-dev

      - name: Build IoT C code
        run: |
          cd iot
          gcc -o iot main.c -lmosquitto

      - name: Run IoT binary (basic check)
        run: |
          cd iot
          ./iot || echo "IoT binary ran (or failed gracefully). Add real tests here."

